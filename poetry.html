<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poetry · Alinah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,600&family=Poppins:wght@400;500;600&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=4">
<script src="assets/js/gate.js?v=4" data-page-lock="1"></script>
<style>
  /* Urdu / RTL poems. Only poems marked rtl:true get the Nastaliq treatment. */
  .poem.rtl{direction:rtl;text-align:right;}
  .poem.rtl h3{font-family:"Noto Nastaliq Urdu",serif;font-size:clamp(1.4rem,3.8vw,2rem);line-height:2.3;}
  .poem.rtl .line{font-family:"Noto Nastaliq Urdu",serif;font-size:clamp(1.05rem,2.7vw,1.45rem);
    line-height:2.7;color:var(--ink);padding-left:6px;}
  .poem.rtl .line.blank{min-height:.5em;line-height:1;}
  .poem.rtl .poet{font-family:"Noto Nastaliq Urdu",serif;font-size:1.25rem;line-height:2.4;}
  .poem.rtl::before{left:22px;right:auto;}
  .poem .poet{color:var(--rose);margin-top:20px;font-family:var(--serif);font-style:italic;font-size:1.15rem;}
  .poem .src{margin-top:10px;font-size:.82rem;color:var(--muted);}
  .poem .src a{color:var(--muted);text-decoration:underline;text-underline-offset:3px;}
  .poem .src a:hover{color:var(--rose);}
  .poem.rtl .author{direction:ltr;text-align:right;}

  /* Bonus: birthday cake */
  .cake-wrap{max-width:540px;margin:0 auto;text-align:center;
    background:linear-gradient(180deg,#fff,var(--blush-2));border-radius:var(--radius);
    padding:clamp(30px,5vw,50px);box-shadow:var(--shadow);border:1px solid rgba(195,154,74,.28);
    position:relative;overflow:hidden;}
  .cake-wrap::after{content:"";position:absolute;inset:0 0 auto 0;height:4px;
    background:linear-gradient(90deg,var(--gold-soft),var(--rose),var(--gold-soft));}
  .cake{font-size:4.8rem;line-height:1;position:relative;display:inline-block;cursor:pointer;
    transition:transform .3s var(--ease);}
  .cake:hover{transform:scale(1.06) rotate(-2deg);}
  .cake:active{transform:scale(.98);}
  .flame{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:1.5rem;
    animation:flick .5s infinite alternate;filter:drop-shadow(0 0 10px rgba(241,133,159,.8));}
  @keyframes flick{
    from{opacity:.72;transform:translateX(-50%) scale(.88) rotate(-4deg);}
    to{opacity:1;transform:translateX(-52%) scale(1.12) rotate(4deg);}
  }
  .cake.out .flame{display:none;}
  .cake.out{filter:saturate(.9);}
  .wishmsg{margin-top:18px;font-family:var(--serif);font-size:1.45rem;color:var(--rose);min-height:1.4em;}
</style>
</head>
<body data-page="poetry.html">

<header class="section wrap center" style="padding-bottom:16px;">
  <p class="eyebrow fade in">Some words worth keeping</p>
  <h1 class="fade in" style="font-size:clamp(2.4rem,6vw,4rem);">Poetry</h1>
  <p class="fade in" style="color:var(--muted);max-width:52ch;margin:0 auto;">Shakespeare, Faiz and Parveen Shakir, and a couple of quieter ones after them.</p>
</header>

<section class="wrap" style="padding-bottom:40px;">
  <div class="poems" id="poems"></div>
</section>

<section class="section wrap">
  <div class="center fade in">
    <p class="eyebrow">One more thing</p>
    <h2>Make a wish</h2>
  </div>
  <div class="cake-wrap fade in">
    <div class="cake" id="cake"><span class="flame" id="flame">🔥</span>🎂</div>
    <p style="color:var(--muted);margin-top:14px;">Tap the cake, shut your eyes, blow out the candle.</p>
    <div class="wishmsg" id="wishmsg"></div>
  </div>
</section>

<footer class="foot">Made with <span class="heart">♥</span> for Alinah Qureshi</footer>

<script src="assets/js/data.js?v=4"></script>
<script src="assets/js/main.js?v=4"></script>
<script>
  // Render poems with a gentle line-by-line reveal
  const container=document.getElementById("poems");
  container.innerHTML=SITE.poems.map(p=>`
    <article class="poem fade ${p.rtl?'rtl':''}" ${p.rtl?'lang="ur" dir="rtl"':''}>
      <h3>${p.title}</h3>
      <div class="lines">${p.lines.map(l=>`<div class="line ${l.trim()===''?'blank':''}" style="opacity:0;transform:translateY(6px);transition:.6s;">${l||"&nbsp;"}</div>`).join("")}</div>
      ${p.poet?`<div class="poet">${p.poet}</div>`:""}
      ${p.author?`<div class="author">${p.author}</div>`:""}
      ${p.source?`<div class="src"><a href="${p.source}" target="_blank" rel="noopener">${p.note||'source'}</a></div>`:(p.note?`<div class="src">${p.note}</div>`:"")}
    </article>`).join("");

  const io=new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){
      e.target.classList.add("in");
      e.target.querySelectorAll(".line").forEach((ln,i)=>{
        setTimeout(()=>{ln.style.opacity=1;ln.style.transform="none";}, i*180);
      });
      io.unobserve(e.target);
    }
  }),{threshold:.2});
  document.querySelectorAll(".poem").forEach(el=>io.observe(el));

  // Bonus cake
  const cake=document.getElementById("cake"), wishmsg=document.getElementById("wishmsg");
  let blown=false;
  cake.addEventListener("click",()=>{
    if(blown){ cake.classList.remove("out"); wishmsg.textContent=""; blown=false; return; }
    cake.classList.add("out"); blown=true;
    wishmsg.textContent="Wish made. Do not tell anybody what it was. 💛";
    confettiBurst(240);
  });
</script>
</body>
</html>
