<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery · Alinah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=4">
<style>
  /* tidy placeholder shown when a photo file isn't in assets/photos yet */
  .tile.missing{cursor:default;}
  .tile .ph{padding:44px 18px;text-align:center;background:linear-gradient(180deg,#fff,var(--blush-2));
    border:2px dashed var(--gold-soft);border-radius:12px;color:var(--muted);font-size:.85rem;line-height:1.6;}
  .tile .ph b{display:block;font-family:var(--serif);font-size:1.1rem;color:var(--rose);margin-bottom:8px;}
</style>
<script src="assets/js/gate.js?v=4"></script>
</head>
<body data-page="gallery.html">

<header class="section wrap center" style="padding-bottom:24px;">
  <p class="eyebrow fade in">Every version of you</p>
  <h1 class="fade in" style="font-size:clamp(2.4rem,6vw,4rem);">The Gallery</h1>
  <p class="fade in" style="color:var(--muted);max-width:56ch;margin:0 auto;">
    All the years, and everyone lucky enough to be in the frame with you. Tap any photo to open it full size. The ★ ones get the big tiles.
  </p>
</header>

<section class="wrap" style="padding-bottom:40px;">
  <div class="gallery" id="gallery"></div>
</section>

<footer class="foot">Made with <span class="heart">♥</span> for Alinah Qureshi</footer>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lb-x" id="lbClose">×</button>
  <button class="lb-nav lb-prev" id="lbPrev">‹</button>
  <img id="lbImg" alt="">
  <button class="lb-nav lb-next" id="lbNext">›</button>
  <div class="lb-cap" id="lbCap"></div>
</div>

<script src="assets/js/data.js?v=4"></script>
<script src="assets/js/main.js?v=4"></script>
<script>
  const gEl=document.getElementById("gallery");
  gEl.innerHTML = SITE.photos.map((p,i)=>`
    <figure class="tile ${p.span===2?'spotlight':''}" data-i="${i}">
      <img src="assets/photos/thumb/${p.src}.jpg" alt="" loading="lazy">
      ${p.cap?`<figcaption class="cap">${p.cap}</figcaption>`:""}
    </figure>`).join("");
  // missing photo files fall back to a tidy placeholder instead of a broken image
  gEl.querySelectorAll(".tile").forEach(tile=>{
    const p = SITE.photos[+tile.dataset.i];
    const img = tile.querySelector("img");
    function markMissing(){
      if(tile.classList.contains("missing")) return;
      tile.classList.add("missing");
      tile.innerHTML = '<div class="ph"><b></b></div>';
      const ph = tile.querySelector(".ph");
      ph.querySelector("b").textContent = p.cap || "Photo";
      ph.appendChild(document.createTextNode("Add assets/photos/thumb/" + p.src + ".jpg"));
    }
    img.addEventListener("error", markMissing);
    // the error may already have fired before this listener was attached
    if(img.complete && img.naturalWidth === 0) markMissing();
  });

  // re-observe newly added tiles
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}}),{threshold:.08});
  document.querySelectorAll(".tile").forEach(t=>io.observe(t));

  // Lightbox
  const lb=document.getElementById("lightbox"), lbImg=document.getElementById("lbImg"), lbCap=document.getElementById("lbCap");
  let cur=0;
  function show(i){
    cur=(i+SITE.photos.length)%SITE.photos.length;
    const p=SITE.photos[cur];
    lbImg.src="assets/photos/"+p.src+".jpg"; lbCap.textContent=p.cap; lb.classList.add("open");
  }
  gEl.addEventListener("click",e=>{const f=e.target.closest(".tile"); if(f&&!f.classList.contains("missing")) show(+f.dataset.i);});
  document.getElementById("lbClose").onclick=()=>lb.classList.remove("open");
  document.getElementById("lbNext").onclick=()=>show(cur+1);
  document.getElementById("lbPrev").onclick=()=>show(cur-1);
  lb.addEventListener("click",e=>{if(e.target===lb)lb.classList.remove("open");});
  document.addEventListener("keydown",e=>{
    if(!lb.classList.contains("open"))return;
    if(e.key==="Escape")lb.classList.remove("open");
    if(e.key==="ArrowRight")show(cur+1);
    if(e.key==="ArrowLeft")show(cur-1);
  });
</script>
</body>
</html>
